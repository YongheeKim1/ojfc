name: 오지FC 푸시 알림

on:
  schedule:
    # 5분마다 (GitHub 부하에 따라 다소 지연될 수 있음)
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # 수동 실행 버튼

# 동시에 두 번 돌지 않도록
concurrency:
  group: push-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        working-directory: scripts/push-notifier
        run: npm install --no-audit --no-fund

      - name: 알림 전송
        working-directory: scripts/push-notifier
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node notify.mjs
