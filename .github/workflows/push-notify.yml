name: 오지FC 푸시 알림

on:
  schedule:
    # 2분마다 요청 (GitHub 스케줄러 부하에 따라 실제로는 5~30분 지연될 수 있음.
    # 간격을 짧게 두면 대기열에 자주 들어가 평균 지연이 줄어듭니다.)
    - cron: '*/2 * * * *'
  workflow_dispatch: {} # 수동 실행 버튼

# 동시에 두 번 돌지 않도록 (전송 도중 취소되면 중복 알림 위험이 있어 false 유지)
concurrency:
  group: push-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        working-directory: scripts/push-notifier
        run: npm install --no-audit --no-fund

      - name: 알림 전송
        working-directory: scripts/push-notifier
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # 한 번 실행될 때 6회 × 50초 ≈ 5분간 반복 점검.
          # GitHub 스케줄러가 늦게 깨워도 실행 자체가 구간을 덮어
          # "방금 올렸는데 다음 실행까지 기다림"이 줄어듭니다.
          POLL_ROUNDS: '6'
          POLL_INTERVAL_SEC: '50'
        run: node notify.mjs
